name: Auto Release

# Cuts a patch release (image + Helm chart) automatically when every commit
# since the last vX.Y.Z tag is a Dependabot patch (merge commits don't count
# either way). If anything else has landed since the last release, it opens
# (or refreshes, with a comment) a "release-needed" issue assigned to the repo
# owner; run the Release workflow to release by hand. If this workflow itself
# fails, it opens a "release-failed" issue instead.
#
# Triggers:
#   - push to main: a Dependabot PR merged by a human (or by RELEASE_BOT_TOKEN)
#   - workflow_dispatch: sent by the CI auto-merge job after it merges a
#     Dependabot PR with GITHUB_TOKEN (those merges don't fire push events),
#     or run by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report what would happen'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Evaluate and release
    runs-on: ubuntu-latest
    env:
      # Optional PAT / app token. When set, the tag push triggers CI on its
      # own; otherwise CI is dispatched explicitly on the new tag.
      HAS_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN != '' }}
      GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run == true }}
      ASSIGNEE: ${{ github.repository_owner }}

    steps:
      - name: Set up paths
        run: echo "COMMITS_FILE=${RUNNER_TEMP}/commits.md" >> "$GITHUB_ENV"

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Classify commits since last release
        id: check
        env:
          PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: .github/scripts/release-check.sh

      - name: Close stale release-needed issue
        if: steps.check.outputs.status == 'none' || steps.check.outputs.status == 'patch-only'
        run: |
          # Only reachable if a manual release reset the baseline.
          .github/scripts/release-issue.sh close release-needed \
            "Resolved: no unreleased non-patch changes remain since ${{ steps.check.outputs.last_tag }}."

      - name: Cut patch release
        id: cut
        if: steps.check.outputs.status == 'patch-only'
        env:
          VERSION: ${{ steps.check.outputs.next_version }}
          LAST_TAG: ${{ steps.check.outputs.last_tag }}
          RELEASE_KIND: automated patch release
        run: .github/scripts/cut-release.sh

      - name: Close release-failed issue
        if: steps.cut.outcome == 'success'
        run: |
          .github/scripts/release-issue.sh close release-failed \
            "Resolved: v${{ steps.check.outputs.next_version }} was released by [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."

      - name: Request manual release
        if: steps.check.outputs.status == 'needs-manual'
        env:
          LAST_TAG: ${{ steps.check.outputs.last_tag }}
          VERSION: ${{ steps.check.outputs.next_version }}
        run: |
          set -euo pipefail
          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/release.yml"
          {
            echo "Dependency patches have merged to \`main\`, but there are also non-patch changes since **${LAST_TAG:-the last release}**, so they were **not** released automatically."
            echo
            echo "To release, run the [Release workflow](${release_url}) (**Run workflow**, pick the bump level). This issue closes itself after the next release."
            echo
            echo "### Commits since ${LAST_TAG:-the beginning}"
            echo
            cat "$COMMITS_FILE"
            echo
            echo "_Last checked by [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})._"
          } > "$RUNNER_TEMP/issue.md"
          cat "$RUNNER_TEMP/issue.md" >> "$GITHUB_STEP_SUMMARY"
          .github/scripts/release-issue.sh open release-needed \
            "Manual release needed: patches waiting since ${LAST_TAG:-last release}" "$RUNNER_TEMP/issue.md"

      - name: Report failure
        if: failure() && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "The automated release check failed in [run ${GITHUB_RUN_ID}](${run_url}) (triggered by \`${{ github.event_name }}\` on \`${GITHUB_SHA:0:7}\`), so any pending patches were **not** released."
            echo
            echo "Check the run log, then release by hand with the [Release workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/release.yml) or re-run this one. This issue closes itself after the next successful release."
          } > "$RUNNER_TEMP/failed.md"
          .github/scripts/release-issue.sh open release-failed "Automated release failed" "$RUNNER_TEMP/failed.md"
