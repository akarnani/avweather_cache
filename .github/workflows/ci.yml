name: CI

on:
  push:
    branches: ['*']
    tags:
      - 'v*.*.*'
  pull_request:
    branches: ['*']
  # Used by auto-release.yml to build/publish a tag it pushed with GITHUB_TOKEN
  # (such pushes don't trigger workflows on their own).
  workflow_dispatch:

jobs:
  # The Go version comes from the Dockerfile's builder image (kept current by
  # Dependabot), so tests, lint and the released image all use the same Go.
  go-version:
    name: Resolve Go version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.go.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Read Go version from Dockerfile
        id: go
        run: |
          VERSION=$(sed -nE 's/^FROM (--[^ ]+ +)*golang:([0-9]+\.[0-9]+(\.[0-9]+)?)-.*/\2/p' Dockerfile | head -n1)
          test -n "$VERSION" || { echo "::error::No golang:X.Y builder image found in Dockerfile"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Go version: $VERSION"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [go-version]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ needs.go-version.outputs.version }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests with race detector
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          file: ./coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [go-version]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ needs.go-version.outputs.version }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: latest

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/akarnani/avweather-cache
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-release:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: 'latest'

      - name: Pin image digest into values.yaml
        env:
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          test -n "$DIGEST"
          yq -i '.image.digest = strenv(DIGEST)' deploy/charts/avweather-cache/values.yaml
          grep -A4 '^image:' deploy/charts/avweather-cache/values.yaml

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957  # v1.9.0
        with:
          charts_dir: deploy/charts
          config: cr.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Log in to GHCR (Helm)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR OCI
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            helm push "$pkg" oci://ghcr.io/akarnani/charts
          done

  helm-oci-main:
    name: Push Helm Chart to GHCR OCI (main)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: 'latest'

      - name: Pin image digest into values.yaml
        env:
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          test -n "$DIGEST"
          yq -i '.image.digest = strenv(DIGEST)' deploy/charts/avweather-cache/values.yaml

      - name: Determine chart version
        id: version
        run: |
          if git describe --tags --match 'v*' --abbrev=8 >/dev/null 2>&1; then
            VERSION=$(git describe --tags --match 'v*' --abbrev=8 | sed 's/^v//')
          else
            CHART_VER=$(yq '.version' deploy/charts/avweather-cache/Chart.yaml)
            SHA=$(git rev-parse --short=8 HEAD)
            VERSION="${CHART_VER}-0.g${SHA}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Chart version: $VERSION"

      - name: Package chart
        run: |
          mkdir -p .helm-packages
          helm package deploy/charts/avweather-cache \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination .helm-packages

      - name: Log in to GHCR (Helm)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR OCI
        run: |
          for pkg in .helm-packages/*.tgz; do
            helm push "$pkg" oci://ghcr.io/akarnani/charts
          done

  dependabot-automerge:
    name: Auto-merge Dependabot PR
    runs-on: ubuntu-latest
    needs: [test, lint, docker]
    # Set the repository variable DEPENDABOT_AUTOMERGE=false to turn this off.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      vars.DEPENDABOT_AUTOMERGE != 'false'
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Major version bumps are left for a human to review and merge.
      - name: Merge PR
        id: merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          # A PAT/app token with the "workflows" permission is needed to merge
          # PRs that touch .github/workflows (e.g. GitHub Actions bumps). It
          # must be added as a Dependabot secret. Without it those PRs fail
          # here and wait for a manual merge.
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR_URL" --merge --match-head-commit "$HEAD_SHA"

      - name: Trigger auto-release
        if: steps.merge.outcome == 'success'
        env:
          HAS_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN != '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A merge made with a PAT fires a normal push event, which already
          # runs auto-release.yml; a GITHUB_TOKEN merge does not.
          if [ "$HAS_BOT_TOKEN" != "true" ]; then
            gh workflow run auto-release.yml --ref main -R "$GITHUB_REPOSITORY"
          fi
