version: 2
# Patch PRs from here are auto-merged by CI (except semver-major bumps) and
# then released automatically by .github/workflows/auto-release.yml when no
# other changes are pending release.
# Review requests for these PRs come from .github/CODEOWNERS.
updates:
  # Go dependencies
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Version updates only cover direct dependencies by default. Every module
    # in go.mod except client_golang and yaml is "// indirect", so without
    # this Dependabot never bumps prometheus/common, procfs, x/sys, etc.
    allow:
      - dependency-type: "all"
    assignees:
      - "akarnani"
    labels:
      - "dependencies"
      - "go"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees:
      - "akarnani"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker base images (pinned by digest in the Dockerfile, so upstream
  # security rebuilds of the same tag also produce PRs)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees:
      - "akarnani"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-base-images:
        patterns:
          - "*"
